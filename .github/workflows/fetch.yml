
---
name: Fetch CurrentsAPI News

on:
  schedule:
    - cron: "7 5 * * *"   # täglich 05:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (py_compile)
        run: python -m py_compile fetch_news.py

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate news.md (mit Debug-URLs)
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: python fetch_news.py


      - name: Merge news.md into docs/index.md
        shell: bash
        run: |
          set -euo pipefail
          echo "# SCM News Übersicht" > docs/index.md
          if [[ -f news.md ]]; then
            cat news.md >> docs/index.md
          else
            echo "_Hinweis: news.md nicht gefunden._" >> docs/index.md
          fi
          echo "Vorschau auf docs/index.md:"
          head -n 30 docs/index.md || true
      
      - name: Upload debug log
        uses: actions/upload-artifact@v4
        with:
          name: news-debug
          path: |
            news_debug.log
            news.md
      
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update docs/index.md aus news.md (CI)"
          file_pattern: |
            docs/index.md
          branch: main
